<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>订单报告后台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Microsoft YaHei', sans-serif; }
        body { background: #f5f1e8; color: #333; min-height: 100vh; }
        .admin-header { background: linear-gradient(135deg, #5c3d2e, #8b4513); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
        .admin-header h1 { font-size: 18px; }
        .btn { border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; background: #d4af37; color: #fff; }
        .btn:hover { opacity: .9; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #5c3d2e; }
        .btn-danger { background: #b3362d; }
        #login-view, #panel-view { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 5px 15px rgba(0,0,0,.06); }
        #login-view { max-width: 380px; margin-top: 12vh; }
        #login-view h2 { color: #8b4513; margin-bottom: 18px; text-align: center; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; margin-bottom: 6px; color: #666; font-size: 14px; }
        .form-row input, .form-row select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .err { color: #b3362d; font-size: 13px; min-height: 18px; margin-top: 8px; }
        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .toolbar select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { padding: 9px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
        th { background: #f7f1e5; color: #5c3d2e; }
        .paid-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .paid-tag.yes { background: #e6f4e6; color: #1e7a34; }
        .paid-tag.no { background: #fdeaea; color: #b3362d; }
        .order-no { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #7a5c43; white-space: nowrap; user-select: all; }
        .site-tag { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 12px; background: #f1ece1; color: #6b5540; }
        .pager { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
        .empty { color: #999; padding: 20px; text-align: center; }
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding: 30px 12px; z-index: 99; overflow: auto; }
        .modal { background: #fff; width: 100%; max-width: 900px; border-radius: 10px; padding: 20px; }
        .modal h3 { color: #8b4513; margin-bottom: 12px; }
        .report-meta { font-size: 13px; color: #666; margin-bottom: 10px; line-height: 1.9; }
        .report-body { white-space: pre-wrap; line-height: 1.9; font-size: 14px; color: #333; background: #fdfaf4; border: 1px solid #eee; border-radius: 8px; padding: 16px; max-height: 65vh; overflow: auto; }
        .stats-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .tile { background: #fdfaf4; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; }
        .tile .k { font-size: 12px; color: #8a7a66; }
        .tile .v { font-size: 24px; font-weight: 700; color: #5c3d2e; line-height: 1.3; }
        .tile .sub { font-size: 12px; color: #999; }
        .chart-wrap { border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fff; }
        .chart-svg { width: 100%; height: 170px; display: block; }
        .chart-legend { font-size: 12px; color: #666; margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
        .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
        #stats-note { font-size: 12px; color: #999; margin-left: auto; }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>润藏八字 · 订单报告后台</h1>
    </div>

    <!-- 登录 -->
    <div id="login-view" class="card">
        <h2>管理员登录</h2>
        <div class="form-row">
            <label>用户名</label>
            <input type="text" id="admin-user" autocomplete="username">
        </div>
        <div class="form-row">
            <label>密码</label>
            <input type="password" id="admin-pass" autocomplete="current-password">
        </div>
        <button class="btn" id="login-btn" style="width:100%; padding:10px;">登 录</button>
        <div class="err" id="login-err"></div>
    </div>

    <!-- 管理面板 -->
    <div id="panel-view" style="display:none;">
        <div class="card" style="margin-bottom:16px;">
            <div class="toolbar">
                <strong style="color:#5c3d2e;">站点统计</strong>
                <select id="stats-days">
                    <option value="1">今天</option>
                    <option value="7">近 7 天</option>
                    <option value="30" selected>近 30 天</option>
                    <option value="90">近 90 天</option>
                </select>
                <button class="btn" id="stats-refresh">刷新统计</button>
                <span id="stats-note"></span>
            </div>
            <div id="stats-tiles" class="stats-tiles"></div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>站点</th><th>访问量</th><th>访客数</th><th>测算量</th><th>下单量</th><th>已支付</th><th>未支付</th><th>收入</th></tr>
                    </thead>
                    <tbody id="stats-tbody"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
                </table>
            </div>
            <div class="chart-wrap" style="margin-top:14px;">
                <div style="font-size:13px;color:#5c3d2e;margin-bottom:6px;">每日趋势</div>
                <svg id="stats-chart" class="chart-svg" viewBox="0 0 720 170" preserveAspectRatio="none"></svg>
                <div class="chart-legend">
                    <span><i style="background:#8b4513;"></i>访问量</span>
                    <span><i style="background:#d4af37;"></i>测算量</span>
                    <span><i style="background:#1e7a34;"></i>已支付</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="toolbar">
                <strong style="color:#5c3d2e;">订单报告列表</strong>
                <select id="filter-paid">
                    <option value="">全部支付状态</option>
                    <option value="1">已支付</option>
                    <option value="0">未支付</option>
                </select>
                <select id="filter-service">
                    <option value="">全部服务</option>
                    <option value="测算验证">测算验证</option>
                    <option value="流年运程">流年运程</option>
                    <option value="人生详批">人生详批</option>
                    <option value="八字合婚">八字合婚</option>
                </select>
                <button class="btn" id="refresh-btn">刷新</button>
                <button class="btn btn-outline" id="logout-btn" style="margin-left:auto;">退出登录</button>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>时间</th><th>来源</th><th>服务</th><th>姓名</th><th>性别</th><th>八字</th><th>金额</th><th>订单号</th><th>支付</th><th>操作</th></tr>
                    </thead>
                    <tbody id="report-tbody"><tr><td colspan="11" class="empty">加载中…</td></tr></tbody>
                </table>
            </div>
            <div class="pager">
                <button class="btn btn-outline" id="prev-btn">上一页</button>
                <span id="page-info" style="font-size:13px;color:#666;"></span>
                <button class="btn btn-outline" id="next-btn">下一页</button>
            </div>
        </div>
    </div>

    <!-- 详情 -->
    <div class="modal-mask" id="detail-mask">
        <div class="modal">
            <h3>完整分析报告</h3>
            <div class="report-meta" id="detail-meta"></div>
            <button class="btn" id="copy-btn">复制全文</button>
            <button class="btn btn-outline" id="close-btn">关闭</button>
            <div class="report-body" id="detail-body" style="margin-top:12px;"></div>
        </div>
    </div>

    <script src="js/core/admin.js?v=3"></script>
</body>
</html>
